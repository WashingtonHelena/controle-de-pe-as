<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Retirada de Peças / Produção</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>
body{
  font-family:Arial;
  background:#eef2f6;
  margin:0;
  padding:15px;
}
.container{
  max-width:1000px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
.top{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.logo{
  height:50px;
}
h1{
  margin:0;
  color:#2c3e50;
  font-size:22px;
}
.menu-tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}
.menu-tab{
  padding:10px 15px;
  background:#2c7be5;
  color:white;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}
.menu-tab.active{
  background:#1c5bbf;
}
.inputs{
  display:flex;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
input,select{
  padding:10px;
  font-size:16px;
  border-radius:5px;
  border:1px solid #ccc;
}
#codigo{
  flex:1;
  font-size:18px;
}
#observacao{
  width:100%;
  margin-bottom:10px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th{
  background:#2c7be5;
  color:white;
  padding:10px;
}
td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
tr:hover{
  background:#f5f9ff;
}
.qtdInput{
  width:60px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:4px;
}
.btn{
  margin-top:15px;
  padding:14px;
  background:#27ae60;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
  width:100%;
}
.resumo{
  margin:15px 0;
  padding:10px;
  background:#f1f6ff;
  border-left:5px solid #2c7be5;
  font-weight:bold;
}
.hidden{
  display:none;
}
</style>
</head>
<body>

<div class="container">

<div class="top">
  <img src="logo_siloking.png" class="logo">
  <h1>Controle de Peças</h1>
</div>

<div class="menu-tabs">
  <div class="menu-tab active" data-tab="retirada">Retirada de Peças</div>
  <div class="menu-tab" data-tab="producao">Ordem de Produção</div>
</div>

<!-- ABA RETIRADA -->
<div id="tab-retirada">
  <div class="inputs">
    <select id="mecanico">
      <option>ANTONIO</option>
      <option>RENATO</option>
      <option>MAURICIO</option>
      <option>ALAN</option>
      <option>DANIEL</option>
      <option>DANILO</option>
      <option>LUCAS</option>
      <option>WILLIAM</option>
      <option>JOSE ROBERTO</option>
      <option>AGNALDO</option>
      <option>PRODUÇÃO</option>
    </select>
    <div style="display:flex; flex:1; gap:5px;">
      <input id="codigo" placeholder="Bipar código da peça">
      <button onclick="adicionarCodigo()" style="padding:10px 15px;background:#2c7be5;color:white;border:none;border-radius:5px;">OK</button>
    </div>
  </div>
  <input id="observacao" placeholder="Máquina / Observação (ex: Vagão 2, Mixer 3)">
  <div class="resumo">
    Itens diferentes: <span id="totalItens">0</span> |
    Total de peças: <span id="totalPecas">0</span>
  </div>
  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Produto</th>
        <th>Quantidade</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>
  <button class="btn" onclick="gerarPDF('retirada')">GERAR RELATÓRIO PDF</button>
</div>

<!-- ABA PRODUÇÃO -->
<div id="tab-producao" class="hidden">
  <div class="inputs">
    <select id="maquinaProducao">
      <option>Compact 9</option>
      <option>Compact 12</option>
      <option>Duo 14</option>
      <option>Duo 18</option>
      <option>Premium 22</option>
      <option>Premium 26</option>
      <option>Premium 30</option>
      <option>1000+ 35</option>
      <option>1000+ 40</option>
      <option>1000+ 45</option>
      <option>Self Premium 19</option>
      <option>Self 1000+ 32</option>
    </select>
    <input id="serieProducao" placeholder="Série da máquina">
  </div>
  <div class="inputs">
    <input id="codigoProducao" placeholder="Bipar código da peça">
    <button onclick="adicionarCodigoProducao()" style="padding:10px 15px;background:#2c7be5;color:white;border:none;border-radius:5px;">OK</button>
  </div>
  <div class="resumo">
    Itens diferentes: <span id="totalItensProd">0</span> |
    Total de peças: <span id="totalPecasProd">0</span>
  </div>
  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Produto</th>
        <th>Quantidade</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="listaProducao"></tbody>
  </table>
  <button class="btn" onclick="gerarPDF('producao')">FINALIZAR PRODUÇÃO</button>
</div>

<script>
let produtos=[];
let retirada=[];
let producao=[];

fetch("produtos_base_completa.json")
.then(r=>r.json())
.then(data=>produtos=data);

// MENU TAB
document.querySelectorAll(".menu-tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll(".menu-tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("tab-retirada").classList.add("hidden");
    document.getElementById("tab-producao").classList.add("hidden");
    document.getElementById("tab-"+tab.dataset.tab).classList.remove("hidden");
  });
});

// ---------------------- RETIRADA DE PEÇAS ----------------------
document.getElementById("codigo").addEventListener("keypress",function(e){
  if(e.key==="Enter"){ adicionarCodigo(); }
});
function atualizarResumo(){
  document.getElementById("totalItens").innerText = retirada.length;
  let total = retirada.reduce((s,i)=>s+i.quantidade,0);
  document.getElementById("totalPecas").innerText = total;
}
function adicionarCodigo(){
  let campo=document.getElementById("codigo");
  let codigo=campo.value.trim();
  if(!codigo) return;
  let produto=produtos.find(p=>p.codigo==codigo);
  if(!produto){ alert("Produto não encontrado"); return; }
  let existente=retirada.find(p=>p.codigo==codigo);
  if(existente){ existente.quantidade++; }
  else{ retirada.push({codigo:produto.codigo,nome:produto.nome,quantidade:1}); }
  render();
  campo.value="";
}
function render(){
  let tabela=document.getElementById("lista");
  tabela.innerHTML="";
  retirada.forEach((item,index)=>{
    tabela.innerHTML+=`
    <tr>
      <td>${item.codigo}</td>
      <td>${item.nome}</td>
      <td>
        <button onclick="diminuir(${index})">-</button>
        <input class="qtdInput" type="number" value="${item.quantidade}" onchange="alterarQtd(${index},this.value)">
        <button onclick="aumentar(${index})">+</button>
      </td>
      <td>
        <button style="background:#e74c3c;color:white;border:none;padding:5px 10px;border-radius:5px;" onclick="remover(${index})">X</button>
      </td>
    </tr>`;
  });
  atualizarResumo();
}
function alterarQtd(i,v){ retirada[i].quantidade=parseInt(v)||1; atualizarResumo(); }
function aumentar(i){ retirada[i].quantidade++; render(); }
function diminuir(i){ if(retirada[i].quantidade>1){ retirada[i].quantidade--; render(); } }
function remover(i){ retirada.splice(i,1); render(); }

// ---------------------- PRODUÇÃO ----------------------
document.getElementById("codigoProducao").addEventListener("keypress",function(e){
  if(e.key==="Enter"){ adicionarCodigoProducao(); }
});
function atualizarResumoProd(){
  document.getElementById("totalItensProd").innerText = producao.length;
  let total = producao.reduce((s,i)=>s+i.quantidade,0);
  document.getElementById("totalPecasProd").innerText = total;
}
function adicionarCodigoProducao(){
  let campo=document.getElementById("codigoProducao");
  let codigo=campo.value.trim();
  if(!codigo) return;
  let produto=produtos.find(p=>p.codigo==codigo);
  if(!produto){ alert("Produto não encontrado"); return; }
  let existente=producao.find(p=>p.codigo==codigo);
  if(existente){ existente.quantidade++; }
  else{ producao.push({codigo:produto.codigo,nome:produto.nome,quantidade:1}); }
  renderProducao();
  campo.value="";
}
function renderProducao(){
  let tabela=document.getElementById("listaProducao");
  tabela.innerHTML="";
  producao.forEach((item,index)=>{
    tabela.innerHTML+=`
    <tr>
      <td>${item.codigo}</td>
      <td>${item.nome}</td>
      <td>
        <button onclick="diminuirProd(${index})">-</button>
        <input class="qtdInput" type="number" value="${item.quantidade}" onchange="alterarQtdProd(${index},this.value)">
        <button onclick="aumentarProd(${index})">+</button>
      </td>
      <td>
        <button style="background:#e74c3c;color:white;border:none;padding:5px 10px;border-radius:5px;" onclick="removerProd(${index})">X</button>
      </td>
    </tr>`;
  });
  atualizarResumoProd();
}
function alterarQtdProd(i,v){ producao[i].quantidade=parseInt(v)||1; atualizarResumoProd(); }
function aumentarProd(i){ producao[i].quantidade++; renderProducao(); }
function diminuirProd(i){ if(producao[i].quantidade>1){ producao[i].quantidade--; renderProducao(); } }
function removerProd(i){ producao.splice(i,1); renderProducao(); }

// ---------------------- GERAR PDF ----------------------
function gerarPDF(tipo){
  let doc=new jsPDF();
  let data=new Date().toLocaleDateString();
  if(tipo==='retirada'){
    let mecanico=document.getElementById("mecanico").value;
    let observacao=document.getElementById("observacao").value;
    let titulo="SILOKING DO BRASIL";
    let larguraTexto=doc.getTextWidth(titulo);
    let xCentro=105;
    doc.setFont("helvetica","bold");
    doc.setFontSize(22);
    doc.setFillColor(0,0,0);
    doc.rect(xCentro-(larguraTexto/2),15,larguraTexto,6,"F");
    doc.setTextColor(0,0,0);
    doc.text(titulo,xCentro,30,{align:"center"});
    doc.setFillColor(0,0,0);
    doc.rect(xCentro-(larguraTexto/2),33,larguraTexto,6,"F");
    doc.setFontSize(12);
    doc.text("Controle de Retirada de Peças",105,45,{align:"center"});
    doc.setFont("helvetica","normal");
    doc.setFontSize(11);
    doc.text("Mecânico: "+mecanico,14,55);
    doc.text("Data retirada: "+data,14,62);
    doc.text("Máquina / Observação: "+observacao,14,69);
    let dados=retirada.map(i=>[i.codigo,i.nome,i.quantidade]);
    doc.autoTable({
      startY:78,
      head:[["Código","Produto","Quantidade"]],
      body:dados,
      theme:"grid",
      styles:{lineWidth:0.6},
      headStyles:{fillColor:[0,0,0],textColor:255}
    });
    let y=doc.lastAutoTable.finalY+10;
    doc.setFont("helvetica","bold");
    doc.text("RETIRADA",14,y); y+=10;
    doc.setFont("helvetica","normal");
    doc.text("Assinatura Mecânico:",14,y);
    doc.line(60,y,170,y); y+=15;
    doc.text("Responsável Estoque:",14,y);
    doc.line(70,y,170,y); y+=25;
    doc.setFont("helvetica","bold");
    doc.text("DEVOLUÇÃO",14,y); y+=10;
    doc.setFont("helvetica","normal");
    doc.text("Data retorno: ____ / ____ / ______",14,y);
    let retorno=retirada.map(i=>[i.codigo,i.nome,""]);
    doc.autoTable({
      startY:y+5,
      head:[["Código","Produto","Qtd retornada"]],
      body:retorno,
      theme:"grid",
      styles:{lineWidth:0.6},
      headStyles:{fillColor:[0,0,0],textColor:255}
    });
    y=doc.lastAutoTable.finalY+10;
    doc.text("Assinatura Mecânico:",14,y); doc.line(60,y,170,y); y+=15;
    doc.text("Responsável Estoque:",14,y); doc.line(70,y,170,y);
    let nomeArquivo="retirada_"+mecanico+"_"+data.replaceAll("/","-")+".pdf";
    doc.save(nomeArquivo);
    let pdfBase64=doc.output('datauristring').split(',')[1];
    fetch("https://script.google.com/macros/s/SEU_SCRIPT_AQUI/exec",{
      method:"POST",
      mode:"no-cors",
      body:JSON.stringify({pdf:pdfBase64,nome:nomeArquivo,data:data,mecanico:mecanico,observacao:observacao})
    });
    retirada=[]; render();
    document.getElementById("observacao").value="";
  } else if(tipo==='producao'){
    let maquina=document.getElementById("maquinaProducao").value;
    let serie=document.getElementById("serieProducao").value;
    let titulo="ORDEM DE PRODUÇÃO";
    doc.setFont("helvetica","bold"); doc.setFontSize(22);
    doc.text(titulo,105,30,{align:"center"});
    doc.setFont("helvetica","normal"); doc.setFontSize(12);
    doc.text("Máquina: "+maquina,14,40);
    doc.text("Série: "+serie,14,47);
    doc.text("Data: "+data,14,54);
    let dados=producao.map(i=>[i.codigo,i.nome,i.quantidade]);
    doc.autoTable({
      startY:60,
      head:[["Código","Produto","Quantidade"]],
      body:dados,
      theme:"grid",
      styles:{lineWidth:0.6},
      headStyles:{fillColor:[0,0,0],textColor:255}
    });
    let y=doc.lastAutoTable.finalY+10;
    doc.setFont("helvetica","bold");
    doc.text("ASSINATURAS",14,y); y+=10;
    doc.setFont("helvetica","normal");
    doc.text("Produção:",14,y); doc.line(60,y,170,y); y+=15;
    doc.text("Estoque:",14,y); doc.line(60,y,170,y);
    let nomeArquivo="producao_"+maquina+"_"+serie+"_"+data.replaceAll("/","-")+".pdf";
    doc.save(nomeArquivo);
    let pdfBase64=doc.output('datauristring').split(',')[1];
    fetch("https://script.google.com/macros/s/SEU_SCRIPT_AQUI/exec",{
      method:"POST",
      mode:"no-cors",
      body:JSON.stringify({pdf:pdfBase64,nome:nomeArquivo,data:data,maquina:maquina,serie:serie})
    });
    producao=[]; renderProducao();
    document.getElementById("serieProducao").value="";
  }
}
</script>

</body>
</html>
